name: Bug report
description: Report a reproducible Field bug
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: What steps reproduce it?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core
        - SDK
        - Storage / ingestion
        - Search / retrieval
        - Explorer
        - Relay integration
        - RAVIN integration
        - Other
    validations:
      required: true
