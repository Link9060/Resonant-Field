name: Feature request
description: Propose a Field capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should Field solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Consumers
      description: Which projects need this (Relay, RAVIN, future apps)?
