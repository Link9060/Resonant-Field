name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository
        run: npm run check

      - name: Build packages
        run: npm run build

      - name: Run core behavior tests
        run: npm test

      - name: Check Explorer JavaScript
        run: |
          node --check apps/explorer/app.js
          node --check apps/explorer/account.mjs

      - name: Verify Atlas ARROW shell contract
        run: |
          grep -q 'data-arrow-os-shell data-module="atlas"' apps/explorer/index.html
          grep -q 'Resonant-Orbit/arrow-shell.css' apps/explorer/index.html
          grep -q 'Resonant-Orbit/arrow-shell.js' apps/explorer/index.html
          ! grep -q 'arrow-system.js' apps/explorer/index.html
